name: Linux-Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # nötig, damit bei einem Tag ein Release angelegt werden kann

jobs:
  linux:
    name: Linux (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    steps:
      - uses: actions/checkout@v4

      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git pkg-config libsdl2-dev libfreetype6-dev zlib1g-dev libpng-dev

      - name: Bauen
        run: VERSION="${GITHUB_REF_NAME//\//-}" bash scripts/build.sh

      - name: Start-Test (ohne Bildschirm)
        run: |
          cd out/cap32-winape-*/
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy timeout 5 ./cap32 --help || test $? -eq 124 || true
          ldd cap32.bin | grep -i "not found" && exit 1 || true

      - name: Paket hochladen
        uses: actions/upload-artifact@v4
        with:
          name: cap32-winape-linux-${{ matrix.os }}
          path: |
            out/*.tar.gz
            out/*.sha256

  release:
    name: Release (nur bei Tag v*)
    needs: linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cap32-winape-linux-ubuntu-22.04
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
