name: Linux-Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Mint 21/22)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git pkg-config libsdl2-dev libfreetype6-dev zlib1g-dev libpng-dev

      - name: Bauen
        run: VERSION="${GITHUB_REF_NAME//\//-}" bash scripts/build.sh

      - name: Paket hochladen
        uses: actions/upload-artifact@v4
        with:
          name: cap32-winape-linux
          path: |
            out/*.tar.gz
            out/*.sha256
